<!-- public/panel.html -->
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración Tienda de Ropa</title>
    <link rel="stylesheet" href="panel.css">
</head>
<body>
    <div class="admin-box">
        <h1>Gestión de Catálogo</h1>

        <form id="formulario-producto" enctype="multipart/form-data">
            <div class="form-grupo">
                <label for="nombre">Nombre de la Prenda:</label>
                <input type="text" id="nombre" name="nombre" required>
            </div>
            <div class="form-grupo">
                <label for="precio">Precio (COP):</label>
                <input type="number" id="precio" name="precio" required>
            </div>
            <div class="form-grupo">
                <label for="descripcion">Descripción del Producto:</label>
                <textarea id="descripcion" name="descripcion" rows="3"></textarea>
            </div>
            <div class="form-grupo">
                <label for="imagenes">Fotografías del Producto (puedes seleccionar varias):</label>
                <input type="file" id="imagenes" name="imagenes" accept="image/*" multiple required>
            </div>
            
            <!-- Nuevo selector de categoría -->
            <div class="form-grupo">
                <label for="categoria">Categoría del Producto:</label>
                <select id="categoria" name="categoria" required style="width: 100%; padding: 8px; margin-top: 5px; border-radius: 4px; border: 1px solid #ccc;">
                    <option value="" disabled selected>Selecciona el tipo de producto</option>
                    <option value="camisetas">Camisetas / Tops</option>
                    <option value="pantalones">Pantalones / Jeans</option>
                    <option value="zapatos">Zapatos / Tenis</option>
                    <option value="accesorios">Accesorios (Gafas, Lociones, etc.)</option>
                </select>
            </div>

            <!-- Nuevo contenedor dinámico de tallas -->
            <div class="form-grupo">
                <label>Tallas disponibles (Se actualizan según la categoría):</label>
                <div id="contenedor-tallas-dinamico" style="display: flex; flex-wrap: wrap; gap: 15px; margin-top: 5px;">
                    <p style="color: #666; font-size: 14px;">Selecciona una categoría primero.</p>
                </div>
            </div>
        
            <button type="submit" class="btn-agregar" style="margin-top: 15px;">Agregar al Catálogo</button>
        </form>

        <p id="mensaje"></p>
        <hr>
        <h2>Inventario Actual</h2>
        <table>
            <thead>
                <tr>
                    <th>Imagen</th>
                    <th>Nombre</th>
                    <th>Precio</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="lista-inventario">
            </tbody>
        </table>
    </div>
    <script src="panel.js"></script>
</body>
</html>
