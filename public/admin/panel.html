<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración</title>
    <link rel="stylesheet" href="/admin/panel.css">
</head>
<body>
    <div class="admin-box">
        <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #eee; padding-bottom: 15px; margin-bottom: 20px;">
            <h1 style="margin: 0; font-size: 24px;">Gestión de Catálogo</h1>
            <button id="btn-logout" style="background-color: #d9534f; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; font-weight: bold;">Cerrar sesión</button>
        </div>

        <form id="formulario-producto" enctype="multipart/form-data">
            <div class="form-grupo">
                <label for="nombre">Nombre de la Prenda:</label>
                <input type="text" id="nombre" name="nombre" required>
            </div>
            <div class="form-grupo">
                <label for="precio">Precio (COP):</label>
                <input type="number" id="precio" name="precio" required>
            </div>
            <div class="form-grupo">
                <label for="descripcion">Descripción del Producto:</label>
                <textarea id="descripcion" name="descripcion" rows="3"></textarea>
            </div>
            <div class="form-grupo">
                <label for="imagenes">Fotografías del Producto (puedes seleccionar varias):</label>
                <input type="file" id="imagenes" name="imagenes" accept="image/*" multiple required>
            </div>
            
            <div class="form-grupo">
                <label for="categoria">Categoría del Producto:</label>
                <select id="categoria" name="categoria" required style="width: 100%; padding: 8px; margin-top: 5px; border-radius: 4px; border: 1px solid #ccc;">
                    <option value="" disabled selected>Selecciona el tipo de producto</option>
                    <option value="camisetas">Camisetas / Tops</option>
                    <option value="pantalones">Pantalones / Jeans</option>
                    <option value="zapatos">Zapatos / Tenis</option>
                    <option value="accesorios">Accesorios (Gafas, Lociones, etc.)</option>
                </select>
            </div>

            <div class="form-grupo">
                <label>Tallas disponibles:</label>
                <div id="contenedor-tallas-dinamico" style="display: flex; flex-wrap: wrap; gap: 15px; margin-top: 5px;">
                    <p style="color: #666; font-size: 14px;">Selecciona una categoría primero.</p>
                </div>
            </div>
        
            <button type="submit" class="btn-agregar" style="margin-top: 15px;">Agregar al Catálogo</button>
        </form>

        <p id="mensaje"></p>
        <hr>
        <h2>Inventario Actual</h2>
        <table>
            <thead>
                <tr>
                    <th>Imagen</th>
                    <th>Nombre</th>
                    <th>Precio</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="lista-inventario"></tbody>
        </table>
        
        <div id="paginacion-admin" style="display: flex; justify-content: center; align-items: center; gap: 8px; margin-top: 20px; padding-bottom: 30px;"></div>
    </div>

    <!-- NUEVO MODAL DE EDICIÓN COMPLETA -->
    <div id="modal-edicion" class="modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); justify-content: center; align-items: center; z-index: 1000;">
        <div style="background: white; padding: 25px; border-radius: 8px; width: 90%; max-width: 500px; max-height: 90vh; overflow-y: auto; box-shadow: 0 4px 15px rgba(0,0,0,0.2);">
            <h3 style="margin-top: 0; color: #222; border-bottom: 1px solid #eee; padding-bottom: 10px;">Editar Producto</h3>
            
            <form id="formulario-editar-producto" enctype="multipart/form-data">
                <div class="form-grupo" style="margin-bottom: 15px; text-align: left;">
                    <label for="edit-nombre" style="font-weight: bold; font-size: 14px;">Nombre:</label>
                    <input type="text" id="edit-nombre" name="nombre" required style="width: 100%; padding: 8px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px;">
                </div>
                
                <div class="form-grupo" style="margin-bottom: 15px; text-align: left;">
                    <label for="edit-precio" style="font-weight: bold; font-size: 14px;">Precio (COP):</label>
                    <input type="number" id="edit-precio" name="precio" required style="width: 100%; padding: 8px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px;">
                </div>
                
                <div class="form-grupo" style="margin-bottom: 15px; text-align: left;">
                    <label for="edit-descripcion" style="font-weight: bold; font-size: 14px;">Descripción:</label>
                    <textarea id="edit-descripcion" name="descripcion" rows="3" style="width: 100%; padding: 8px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px;"></textarea>
                </div>
                
                <div class="form-grupo" style="margin-bottom: 15px; text-align: left;">
                    <label for="edit-categoria" style="font-weight: bold; font-size: 14px;">Categoría:</label>
                    <select id="edit-categoria" name="categoria" required style="width: 100%; padding: 8px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px;">
                        <option value="" disabled>Selecciona el tipo</option>
                        <option value="camisetas">Camisetas / Tops</option>
                        <option value="pantalones">Pantalones / Jeans</option>
                        <option value="zapatos">Zapatos / Tenis</option>
                        <option value="accesorios">Accesorios</option>
                    </select>
                </div>
                
                <div class="form-grupo" style="margin-bottom: 15px; text-align: left;">
                    <label style="font-weight: bold; font-size: 14px;">Tallas disponibles:</label>
                    <div id="edit-contenedor-tallas" style="display: flex; flex-wrap: wrap; gap: 15px; margin-top: 5px; padding: 10px; background: #f9f9f9; border-radius: 4px;">
                    </div>
                </div>
                
                <div class="form-grupo" style="margin-bottom: 15px; text-align: left;">
                    <label for="edit-imagenes" style="font-weight: bold; font-size: 14px;">Nuevas Fotografías (dejar en blanco para conservar las actuales):</label>
                    <input type="file" id="edit-imagenes" name="imagenes" accept="image/*" multiple style="width: 100%; margin-top: 5px;">
                </div>
                
                <p id="edit-mensaje" style="font-size: 14px; margin-top: 10px;"></p>
                
                <div style="display: flex; justify-content: space-between; margin-top: 20px;">
                    <button type="button" id="btn-cancelar-edicion" style="padding: 10px 15px; border: none; background: #eee; color: #333; border-radius: 4px; cursor: pointer; font-weight: bold;">Cancelar</button>
                    <button type="submit" style="padding: 10px 15px; border: none; background: #f39c12; color: white; border-radius: 4px; cursor: pointer; font-weight: bold;">Guardar Cambios</button>
                </div>
            </form>
        </div>
    </div>
    
    <script src="/admin/panel.js"></script>
</body>
</html>
