<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración</title>
    <!-- Ruta corregida con / inicial -->
    <link rel="stylesheet" href="/admin/panel.css">
</head>
<body>
    <div class="admin-box">
        <h1>Gestión de Catálogo</h1>

        <form id="formulario-producto" enctype="multipart/form-data">
            <div class="form-grupo">
                <label for="nombre">Nombre de la Prenda:</label>
                <input type="text" id="nombre" name="nombre" required>
            </div>
            <div class="form-grupo">
                <label for="precio">Precio (COP):</label>
                <input type="number" id="precio" name="precio" required>
            </div>
            <div class="form-grupo">
                <label for="descripcion">Descripción del Producto:</label>
                <textarea id="descripcion" name="descripcion" rows="3"></textarea>
            </div>
            <div class="form-grupo">
                <label for="imagenes">Fotografías del Producto (puedes seleccionar varias):</label>
                <input type="file" id="imagenes" name="imagenes" accept="image/*" multiple required>
            </div>
            
            <div class="form-grupo">
                <label for="categoria">Categoría del Producto:</label>
                <select id="categoria" name="categoria" required style="width: 100%; padding: 8px; margin-top: 5px; border-radius: 4px; border: 1px solid #ccc;">
                    <option value="" disabled selected>Selecciona el tipo de producto</option>
                    <option value="camisetas">Camisetas / Tops</option>
                    <option value="pantalones">Pantalones / Jeans</option>
                    <option value="zapatos">Zapatos / Tenis</option>
                    <option value="accesorios">Accesorios (Gafas, Lociones, etc.)</option>
                </select>
            </div>

            <div class="form-grupo">
                <label>Tallas disponibles:</label>
                <div id="contenedor-tallas-dinamico" style="display: flex; flex-wrap: wrap; gap: 15px; margin-top: 5px;">
                    <p style="color: #666; font-size: 14px;">Selecciona una categoría primero.</p>
                </div>
            </div>
        
            <button type="submit" class="btn-agregar" style="margin-top: 15px;">Agregar al Catálogo</button>
        </form>

        <p id="mensaje"></p>
        <hr>
        <h2>Inventario Actual</h2>
        <table>
            <thead>
                <tr>
                    <th>Imagen</th>
                    <th>Nombre</th>
                    <th>Precio</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="lista-inventario"></tbody>
        </table>

        <!-- Contenedor para los botones de paginación del admin -->
        <div id="paginacion-admin" style="display: flex; justify-content: center; align-items: center; gap: 8px; margin-top: 20px; padding-bottom: 30px;"></div>

    </div>
    <!-- Ventana Modal de Edición (Oculta por defecto) -->
    <div id="modal-edicion" class="modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000;">
        <div style="background: white; padding: 25px; border-radius: 8px; width: 100%; max-width: 300px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.2);">
            <h3 id="modal-edicion-titulo" style="margin-top: 0; color: #222;">Editar</h3>
            <p id="modal-edicion-desc" style="font-size: 14px; color: #666;"></p>
            <input type="text" id="modal-edicion-input" style="width: 90%; padding: 10px; margin: 15px 0; border: 1px solid #ccc; border-radius: 4px; font-size: 16px;">
            <div style="display: flex; justify-content: space-between; margin-top: 15px;">
                <button id="btn-cancelar-edicion" style="padding: 10px 15px; border: none; background: #eee; color: #333; border-radius: 4px; cursor: pointer; font-weight: bold;">Cancelar</button>
                <button id="btn-guardar-edicion" style="padding: 10px 15px; border: none; background: #f39c12; color: white; border-radius: 4px; cursor: pointer; font-weight: bold;">Guardar</button>
            </div>
        </div>
    </div>
    
    <script src="/admin/panel.js"></script>
</body>
</html>
